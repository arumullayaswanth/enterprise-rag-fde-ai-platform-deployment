name: fde-rag-deployment

# Manual only. Pick "apply" to deploy everything, or "destroy" to tear it all
# down. There is no automatic deploy on push or pull_request.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        required: true
        default: apply
        options:
          - apply
          - destroy

permissions:
  contents: read
  id-token: write # required for AWS OIDC (no long-lived access keys)

env:
  # Region comes from a GitHub Actions variable, not hardcoded.
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VERSION: 1.15.5
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}

concurrency:
  group: fde-rag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  #  APPLY -- lint, build both images, then apply everything
  # =========================================================================
  apply:
    name: apply
    if: ${{ github.event.inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    environment: prod
    env:
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint the Python
        run: |
          pip install ruff==0.8.4
          ruff check app

      - name: Check required config is set
        run: |
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "::error::Set the AWS_REGION repository variable (e.g. us-east-1)."; exit 1
          fi
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "::error::Create an S3 bucket for Terraform state, then set the TF_STATE_BUCKET repository variable."; exit 1
          fi
          if [ -z "${{ vars.AWS_OIDC_ROLE_ARN }}" ]; then
            echo "::error::Set the AWS_OIDC_ROLE_ARN variable to the IAM role GitHub Actions assumes via OIDC."; exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      # A previous destroy may have left the API-key secret in a 7-day
      # "scheduled for deletion" window, which blocks re-creating the same name.
      # Force-delete it (no recovery window) AND drop it from Terraform state,
      # so apply creates a fresh secret instead of tripping over a stale entry.
      - name: Free the API-key secret name
        run: |
          set +e
          for name in fde-rag-prod-api-key rag-devops-prod-api-key; do
            aws secretsmanager delete-secret --secret-id "$name" \
              --force-delete-without-recovery >/dev/null 2>&1 \
              && echo "force-deleted lingering secret $name" \
              || echo "no lingering secret $name"
          done
          # Drop stale secret entries from state so terraform recreates them.
          terraform -chdir=terraform state rm module.security.aws_secretsmanager_secret.api_key 2>/dev/null || true
          terraform -chdir=terraform state rm module.security.aws_secretsmanager_secret_version.api_key 2>/dev/null || true
          exit 0

      # Step 1: ECR repos first, so images have somewhere to go.
      - name: Create the two ECR repositories
        id: ecr
        run: |
          set -euo pipefail
          terraform -chdir=terraform apply -input=false -auto-approve -lock-timeout=5m \
            -target=module.ecr.aws_ecr_repository.api -target=module.ecr.aws_ecr_repository.ingest
          echo "api=$(terraform -chdir=terraform output -raw api_repository_url)" >> "$GITHUB_OUTPUT"
          echo "ingest=$(terraform -chdir=terraform output -raw ingest_repository_url)" >> "$GITHUB_OUTPUT"

      # Step 2: build and push both images.
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/api/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.api }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the ingest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/ingestion/Dockerfile
          push: true
          provenance: false # Lambda requires a plain single-image manifest.
          tags: ${{ steps.ecr.outputs.ingest }}:${{ github.sha }}
          cache-from: type=gha,scope=ingest
          cache-to: type=gha,scope=ingest,mode=max

      # Step 3: everything else. First run creates OpenSearch (15-25 min).
      - name: terraform apply
        timeout-minutes: 45
        run: terraform -chdir=terraform apply -input=false -auto-approve -lock-timeout=5m

      - name: Wait for the API to come up
        timeout-minutes: 20
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform -chdir=terraform output -raw ecs_cluster_name)" \
            --services "$(terraform -chdir=terraform output -raw ecs_service_name)"

      # Step 4: fill the search index — but ONLY the first time.
      # If documents are already in the bucket under uploads/, they were already
      # uploaded and indexed on a previous deploy, so we skip the slow upload +
      # embedding on every later deploy. Force a rebuild by setting the
      # FORCE_REINDEX repository variable to "true".
      - name: Check if documents are already uploaded
        id: check
        run: |
          set -euo pipefail
          BUCKET=$(terraform -chdir=terraform output -raw documents_bucket)
          echo "BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          # `|| true` so an empty prefix (ls exits 1) does not fail the step.
          COUNT=$(aws s3 ls "s3://${BUCKET}/uploads/" --recursive 2>/dev/null | wc -l | tr -d ' ' || true)
          COUNT=${COUNT:-0}
          if [ "${{ vars.FORCE_REINDEX }}" = "true" ] || [ "$COUNT" -eq 0 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "First deploy (or FORCE_REINDEX=true): will upload + index."
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Documents already present (${COUNT} objects); skipping upload + index."
          fi

      - name: Upload the sample documents
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          aws s3 sync sample-data/ "s3://${BUCKET}/uploads/" --size-only --delete

      - name: Rebuild the search index
        if: steps.check.outputs.needed == 'true'
        timeout-minutes: 20
        env:
          AWS_MAX_ATTEMPTS: "10"
          AWS_RETRY_MODE: adaptive
        run: |
          set -euo pipefail
          FUNCTION=$(terraform -chdir=terraform output -raw ingest_lambda_name)
          ATTEMPTS=8
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if aws lambda invoke \
                 --function-name "$FUNCTION" \
                 --cli-binary-format raw-in-base64-out \
                 --payload "{\"reindex\":true,\"bucket\":\"${BUCKET}\",\"prefix\":\"uploads/\"}" \
                 --cli-read-timeout 900 \
                 result.json >/dev/null 2>invoke.err; then
              break
            fi
            if ! grep -qE 'TooManyRequestsException|ConcurrentInvocationLimitExceeded' invoke.err; then
              cat invoke.err; echo "::error::lambda invoke failed"; exit 1
            fi
            if [ "$attempt" -eq "$ATTEMPTS" ]; then
              cat invoke.err; echo "::error::Still throttled after ${ATTEMPTS} attempts."; exit 1
            fi
            echo "attempt ${attempt}: throttled, waiting for concurrency to free up"; sleep 30
          done
          cat result.json | jq .
          if jq -e 'has("errorMessage")' result.json >/dev/null; then
            echo "::error::Ingest failed: $(jq -r .errorMessage result.json)"; exit 1
          fi
          if [ "$(jq -r '.indexed // 0' result.json)" -lt 1 ]; then
            echo "::error::No passages were indexed"; exit 1
          fi
          SKIPPED=$(jq -r '.skipped // 0' result.json)
          echo "Indexed $(jq -r .indexed result.json) passages (skipped ${SKIPPED} due to throttling)."
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::warning::${SKIPPED} chunks were skipped due to Bedrock throttling. Request a quota increase for Titan embeddings to index everything."
          fi

      - name: Show where it is
        run: |
          set -euo pipefail
          WEB_URL=$(terraform -chdir=terraform output -raw web_url)
          echo "::notice title=Web URL::${WEB_URL}"
          echo "### Web URL" >> "$GITHUB_STEP_SUMMARY"
          echo "[$WEB_URL]($WEB_URL)" >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  #  DESTROY -- tear everything down
  # =========================================================================
  destroy:
    name: destroy
    if: ${{ github.event.inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    environment: prod
    env:
      TF_VAR_image_tag: destroy # a value is required; not used during destroy
    steps:
      - uses: actions/checkout@v4

      - name: Check required config is set
        run: |
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "::error::Set the AWS_REGION repository variable."; exit 1
          fi
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "::error::Set the TF_STATE_BUCKET repository variable."; exit 1
          fi
          if [ -z "${{ vars.AWS_OIDC_ROLE_ARN }}" ]; then
            echo "::error::Set the AWS_OIDC_ROLE_ARN variable."; exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      # Force-empty the documents bucket first. It is versioned, so a plain
      # `s3 rm` leaves old versions and delete markers behind and destroy
      # fails. Delete every current object, every version, and every delete
      # marker. Errors are ignored so destroy still runs if the bucket is gone.
      - name: Force-empty the documents bucket
        run: |
          set +e
          BUCKET=$(terraform -chdir=terraform output -raw documents_bucket 2>/dev/null)
          if [ -z "$BUCKET" ]; then
            echo "No bucket in state; skipping."
            exit 0
          fi
          echo "Force-emptying s3://$BUCKET (objects + versions + delete markers)"
          aws s3 rm "s3://$BUCKET" --recursive

          # Delete all object versions.
          aws s3api list-object-versions --bucket "$BUCKET" \
            --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' --output json > versions.json 2>/dev/null
          if [ -s versions.json ] && grep -q '"Key"' versions.json; then
            aws s3api delete-objects --bucket "$BUCKET" --delete file://versions.json || true
          fi

          # Delete all delete markers.
          aws s3api list-object-versions --bucket "$BUCKET" \
            --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' --output json > markers.json 2>/dev/null
          if [ -s markers.json ] && grep -q '"Key"' markers.json; then
            aws s3api delete-objects --bucket "$BUCKET" --delete file://markers.json || true
          fi
          exit 0

      # Disable deletion protection on the live ALB so destroy can delete it.
      # The ALB may have been created by older code with protection ON; this
      # turns it off directly in AWS regardless of what the state says. If the
      # ALB is already gone this is a harmless no-op.
      - name: Disable ALB deletion protection
        run: |
          set +e
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?starts_with(LoadBalancerName, 'fde-rag') || starts_with(LoadBalancerName, 'rag-devops')].LoadBalancerArn" \
            --output text 2>/dev/null)
          for arn in $ALB_ARN; do
            echo "Disabling deletion protection on $arn"
            aws elbv2 modify-load-balancer-attributes \
              --load-balancer-arn "$arn" \
              --attributes Key=deletion_protection.enabled,Value=false || true
          done
          exit 0

      # Delete the ECR repos outright with --force (removes the repo AND all
      # images in one call). We then drop them from Terraform state so the
      # destroy below does not try to delete them again and fail. This is
      # bulletproof regardless of whether the repo was created with
      # force_delete=false by older code.
      - name: Force-delete the ECR repositories
        run: |
          set +e
          for repo in $(aws ecr describe-repositories \
              --query "repositories[?starts_with(repositoryName, 'fde-rag') || starts_with(repositoryName, 'rag-devops')].repositoryName" \
              --output text 2>/dev/null); do
            echo "Force-deleting ECR repo $repo"
            aws ecr delete-repository --repository-name "$repo" --force || true
          done
          # Remove them from state so terraform destroy skips them cleanly.
          terraform -chdir=terraform state rm module.ecr.aws_ecr_repository.api 2>/dev/null || true
          terraform -chdir=terraform state rm module.ecr.aws_ecr_repository.ingest 2>/dev/null || true
          terraform -chdir=terraform state rm 'module.ecr.aws_ecr_lifecycle_policy.keep_recent["api"]' 2>/dev/null || true
          terraform -chdir=terraform state rm 'module.ecr.aws_ecr_lifecycle_policy.keep_recent["ingest"]' 2>/dev/null || true
          exit 0

      - name: terraform destroy
        timeout-minutes: 45
        run: terraform -chdir=terraform destroy -input=false -auto-approve -lock-timeout=5m

      - name: Done
        run: echo "All infrastructure destroyed."
