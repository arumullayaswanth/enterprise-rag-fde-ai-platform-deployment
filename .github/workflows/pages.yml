name: deploy-architecture-page

# Publishes architecture-animated.html to GitHub Pages by pushing the built
# site to a gh-pages branch. Uses peaceiris/actions-gh-pages, which deploys
# with the automatic GITHUB_TOKEN and needs no manual Pages setup or the
# Pages API that requires elevated permissions.
on:
  push:
    branches: [prod]
    paths:
      - "architecture-animated.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Pushing the gh-pages branch only needs write access to repo contents.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Assemble the site: serve the architecture page as the site index.
      - name: Build the site folder
        run: |
          mkdir -p _site
          cp architecture-animated.html _site/index.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
