name: deploy-architecture-page

# Publishes the architecture page to GitHub Pages using the official Pages
# deploy. Triggers ONLY when the HTML changes (or manually) — not on every
# push. Requires: Settings -> Pages -> Source = "GitHub Actions" (one time).
on:
  push:
    branches: [prod]
    paths:
      - "index.html"
      - "architecture-animated.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Serve the architecture page as the site index.
      - name: Build the site folder
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
