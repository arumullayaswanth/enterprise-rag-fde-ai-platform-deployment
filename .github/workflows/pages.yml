name: deploy-architecture-page

# Keeps the repo-root index.html in sync with architecture-animated.html so
# GitHub Pages (which serves this branch's root) shows the architecture page
# instead of the README. .nojekyll stops Jekyll from reprocessing the HTML.
on:
  push:
    branches: [prod]
    paths:
      - "architecture-animated.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync-index:
    name: sync-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync index.html from architecture page
        run: |
          cp architecture-animated.html index.html
          touch .nojekyll

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet index.html .nojekyll; then
            echo "index.html already up to date."
          else
            git add index.html .nojekyll
            git commit -m "pages: sync root index.html with architecture page [skip ci]"
            git push origin HEAD:prod
          fi

      - name: Show URL
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "::notice title=Page URL::${URL}"
          echo "[$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
